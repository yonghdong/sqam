<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900" width="2000" height="900" role="img">
<title>SQAM overview. QAM and TRQAM propagate the critic gradient backward with a vector-Jacobian product at every flow step, while SQAM scales the gradient at the final action by the flow time with no vector-Jacobian product.</title>
<style>
text { font-family: "Helvetica Neue", Arial, system-ui, sans-serif; fill: #111; }
.sq-serif { font-family: "Times New Roman", Times, serif; }
.sq-axis { font-size: 40px; }
.sq-axis-sm { font-size: 32px; }
.sq-axis-xs { font-size: 26px; }
.sq-title { font-size: 64px; font-weight: 700; }
.sq-sub-title { font-size: 33px; }
.sq-tau { font-size: 34px; }
.sq-node-a { font-size: 38px; }
.sq-grad { font-size: 40px; }
.sq-sub { font-size: 22px; }
.sq-sup { font-size: 22px; }
.sq-jac { font-size: 34px; }
.sq-cost { font-size: 33px; font-weight: 700; }
.sq-ink-stroke { stroke: #222; }
.sq-ink-fill { fill: #222; }
text{fill:#111}.sq-ink-stroke{stroke:#222}.sq-ink-fill{fill:#222}
@keyframes sqdraw{to{stroke-dashoffset:0}}@keyframes sqfade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}[stroke-dashoffset]{stroke-dashoffset:0!important}[opacity]{opacity:1!important}}
@media (prefers-color-scheme: dark){.sq-axis,.sq-axis-sm,.sq-axis-xs{fill:#e6e6e6}.sq-ink-stroke{stroke:#e6e6e6}.sq-ink-fill{fill:#e6e6e6}}
</style>

  
